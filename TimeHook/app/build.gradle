// 这个小模块自己的打包设置
plugins {
    id 'com.android.application'
}

android {
    // 模块的身份证号（包名），跟代码里写的一致
    namespace 'com.kemo.timehook'
    compileSdk 34

    defaultConfig {
        applicationId "com.kemo.timehook"
        minSdk 26          // 安卓 8.0 以上能装
        targetSdk 34
        versionCode 3
        versionName "3.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Xposed 挂钩工具包：只是写代码时参考用，不会打进安装包里
    compileOnly 'de.robv.android.xposed:api:82'
}
